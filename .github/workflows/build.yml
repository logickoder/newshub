name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Trigger on version tags
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Add NEWS_API_KEY to local.properties
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> ./local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests with coverage
        uses: burrunan/gradle-cache-action@v3
        with:
          arguments: :app:testReleaseUnitTest :app:jacocoTestReport
          gradle-version: wrapper

      - name: Generate coverage badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.csv
          badges-directory: badges
          generate-branches-badge: true
          generate-summary: true
          coverage-badge-filename: coverage.svg
          branches-badge-filename: branches.svg

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/
            badges/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70

      - name: Build APK
        uses: burrunan/gradle-cache-action@v3
        with:
          arguments: app:assembleRelease
          gradle-version: wrapper

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newshub-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Get version name
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "# NewsHub ${{ steps.version.outputs.VERSION }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## 📥 Installation" >> release-notes.md
          echo "Download the APK file below and install on your Android device." >> release-notes.md
          echo "" >> release-notes.md
          echo "## 📊 Build Information" >> release-notes.md
          echo "- **Build Date**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md
          echo "- **Commit SHA**: ${{ github.sha }}" >> release-notes.md
          echo "- **Branch**: ${{ github.ref_name }}" >> release-notes.md
          echo "" >> release-notes.md
          echo "## ✨ Features" >> release-notes.md
          echo "- Browse news articles in List or Grid view" >> release-notes.md
          echo "- View detailed article information" >> release-notes.md
          echo "- Pull-to-refresh functionality" >> release-notes.md
          echo "- Search and filter articles" >> release-notes.md
          echo "- Material 3 design with dark mode" >> release-notes.md
          echo "" >> release-notes.md
          echo "## 🔧 Requirements" >> release-notes.md
          echo "- Android 7.0 (API 24) or higher" >> release-notes.md
          echo "- Internet connection" >> release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create build summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Report: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Coverage" >> $GITHUB_STEP_SUMMARY
          echo "View detailed coverage report in the artifacts section." >> $GITHUB_STEP_SUMMARY